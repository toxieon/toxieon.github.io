<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Full Page Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Full Page Capture</h1>
      <p class="muted">v0.2.4 · toolbar click = capture · no ads · data stays on device</p>
    </header>
    <div class="buttons">
      <button type="button" id="btn-image" class="primary">Capture image (PNG)</button>
      <button type="button" id="btn-reconstruct">Reconstruct (searchable HTML)</button>
      <button type="button" id="btn-fullscan">Full scan</button>
    </div>
    <fieldset>
      <legend>Full scan options</legend>
      <label>
        <input type="checkbox" id="follow-pagination" checked />
        Follow next / numbered pages
      </label>
      <label>
        Page limit
        <input type="number" id="page-limit" min="1" max="100" value="25" />
      </label>
      <label>
        <input type="checkbox" id="queue-tab" />
        Add current tab to scan queue
      </label>
      <p class="muted small">Queue is kept for this popup session only.</p>
      <ul id="tab-queue" class="queue"></ul>
      <button type="button" id="btn-clear-queue" class="ghost">Clear queue</button>
    </fieldset>
    <p id="status" class="status" role="status"></p>
    <footer>
      <button type="button" id="btn-open-viewer" class="ghost">Open viewer</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
