<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Full Page Capture</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="../icons/icon-16.png" width="16" height="16" alt="" />
        <span class="brand-name">Full Page Capture</span>
      </div>
      <nav class="toolbar" aria-label="Capture actions">
        <button type="button" id="btn-edit" class="tool primary-tool" title="Edit / annotate" disabled>
          <span class="label">Edit</span>
        </button>
        <button type="button" id="btn-download-png" class="tool download" title="Download PNG" hidden>
          <span class="label">Download PNG</span>
        </button>
        <button type="button" id="btn-pdf" class="tool download" title="Download PDF" hidden>
          <span class="label">PDF</span>
        </button>
        <button type="button" id="btn-view-screenshot" class="tool" title="View stitched screenshot" hidden>
          <span class="label">Screenshot</span>
        </button>
        <button type="button" id="btn-view-page" class="tool" title="View page snapshot (HTML)" hidden>
          <span class="label">Page view</span>
        </button>
        <button type="button" id="btn-search" class="tool" title="Search snapshot">
          <span class="label">Search</span>
        </button>
        <button type="button" id="btn-reconstruct" class="tool" title="Reconstruct searchable HTML">
          <span class="label">Reconstruct</span>
        </button>
        <button type="button" id="btn-history" class="tool" title="History">
          <span class="label">History</span>
        </button>
        <button type="button" id="btn-delete" class="tool danger" title="Delete">
          <span class="label">Delete</span>
        </button>
        <button type="button" id="btn-settings" class="tool" title="Settings">
          <span class="label">Settings</span>
        </button>
      </nav>
    </header>

    <div id="edit-bar" class="edit-bar" hidden>
      <span class="edit-label">Annotate</span>
      <button type="button" id="tool-pen" data-tool="pen" class="active">Pen</button>
      <button type="button" id="tool-highlight" data-tool="highlight">Highlight</button>
      <button type="button" id="tool-arrow" data-tool="arrow">Arrow</button>
      <button type="button" id="tool-text" data-tool="text">Text</button>
      <button type="button" id="btn-undo">Undo</button>
      <button type="button" id="btn-save-edit" class="primary">Save</button>
      <button type="button" id="btn-cancel-edit">Done</button>
    </div>

    <div id="extras-bar" class="extras-bar" hidden>
      <label class="search" for="search-input">
        <span>Search snapshot</span>
        <input type="search" id="search-input" placeholder="Find text…" autocomplete="off" />
      </label>
      <p id="search-status" class="muted"></p>
      <button type="button" id="btn-html" class="ghost" hidden>Download HTML</button>
    </div>

    <div class="stage-shell">
      <div id="drawer-backdrop" class="backdrop" hidden></div>
      <main class="stage">
        <p id="meta" class="meta muted"></p>
        <div id="preview-root" class="preview-root"></div>
      </main>
      <aside id="history-drawer" class="drawer" aria-label="Capture history" hidden>
        <div class="drawer-head">
          <h2>Recent captures</h2>
          <button type="button" id="btn-close-history" class="ghost">Close</button>
        </div>
        <ul id="history-list" class="history"></ul>
      </aside>
    </div>

    <script type="module" src="viewer.js"></script>
  </body>
</html>
